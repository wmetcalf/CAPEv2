name: cape-deb-e2e

# Runs the Layer 4 (host smoke) and Layer 5 (EICAR e2e) test stacks
# against just-published cape-* debs on the dev channel. On both green,
# triggers apt-publish (channel=main) to promote the artifacts to prod.
#
# Triggered automatically by apt-publish.yml's "Trigger e2e harness"
# step after a successful main-dev publish — same-repo dispatch via the
# default GITHUB_TOKEN, no PAT needed.  Manual workflow_dispatch is also
# supported for ad-hoc runs.
#
# Migrated here from the aws-nested-virt IaC repo to eliminate the
# cross-repo dispatch handoff (and the IAC_REPO_DISPATCH_TOKEN PAT).
# The aws-nested-virt/terraform/test/ stacks under this repo's
# aws-nested-virt/terraform/test/ are an exact mirror of the IaC repo's
# tree at migration time; canonical location is here going forward.

on:
  workflow_dispatch:
    inputs:
      cape_core_version:        { type: string, required: true }
      cape_signatures_version:  { type: string, required: true }
      cape_qemu_version:        { type: string, required: true }
      cape_suricata_version:    { type: string, required: true }
      run_layer5:               { type: boolean, default: false }
      promote_on_success:
        type: boolean
        default: true
        description: "If true and Layer 4+5 pass, dispatch apt-publish channel=main."

permissions:
  id-token: write   # OIDC for AWS auth
  contents: read
  actions: write    # so the promote step can `gh workflow run apt-publish.yml`

concurrency:
  group: cape-deb-e2e
  cancel-in-progress: false

jobs:
  layer4:
    name: Layer 4 — host smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.E2E_TEST_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install terraform + AWS CLI helpers
        run: |
          set -euo pipefail
          # Direct download of pinned terraform binary.  HashiCorp's
          # apt repo (apt.releases.hashicorp.com) had its Packages.gz
          # served as a 20-byte truncated stub on 2026-05-15, causing
          # `apt-get install terraform` to fail with "Unable to locate
          # package terraform" on three consecutive cape-deb-e2e runs.
          # The .zip release
          # at releases.hashicorp.com is unaffected — it's the
          # canonical artifact, not derived from the apt index.
          TF_VERSION="1.13.5"
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/terraform
          terraform version
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq

      - name: Run Layer 4 driver
        env:
          THREAT_CONTENT_URL: ${{ vars.THREAT_CONTENT_URL }}
        run: |
          set -euo pipefail
          ./aws-nested-virt/terraform/test/scripts/run-layer-test.sh \
            --layer 4 \
            --apt-repo-url       "${{ vars.APT_DEV_REPO_URL }}" \
            --apt-keyring-url    "${{ vars.APT_DEV_REPO_URL }}/keyring.asc" \
            --threat-content-url "$THREAT_CONTENT_URL" \
            --cape-core-version       "${{ inputs.cape_core_version }}" \
            --cape-signatures-version "${{ inputs.cape_signatures_version }}" \
            --cape-qemu-version       "${{ inputs.cape_qemu_version }}" \
            --cape-suricata-version   "${{ inputs.cape_suricata_version }}" \
            --test-run-id     "$GITHUB_RUN_ID" \
            --region          us-east-1

  layer5:
    name: Layer 5 — EICAR detonation
    needs: layer4
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Real EICAR detonation gate. Runs when we intend to promote (its whole
    # purpose is to gate promotion) or when explicitly forced via run_layer5.
    # It launches the latest baked cape-host-base AMI, overlays the dev debs
    # under test, rebuilds the Win11 fleet, and submits EICAR through the CAPE
    # API — asserting score/disposition/detections via broker/sandbox_forensics.
    # Before the FIRST bake no cape-host-base AMI exists, so the resolve step
    # SKIPS the detonation (non-blocking): the first promotion proceeds on
    # Layer 4 alone and every later one is detonation-gated. A real detonation
    # FAILURE fails this job, which blocks promote via its !failure() gate.
    if: ${{ needs.layer4.result == 'success' && (inputs.run_layer5 || inputs.promote_on_success) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.E2E_TEST_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve baseline cape-host-base AMI (skip detonation if none yet)
        id: baseline
        run: |
          set -euo pipefail
          ami=$(aws ec2 describe-images --region us-east-1 --owners self \
            --filters 'Name=tag:Owner,Values=capev2' \
                      'Name=tag:Purpose,Values=cape-host-base' \
                      'Name=tag:Retention,Values=keep' \
                      'Name=state,Values=available' \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text 2>/dev/null || echo None)
          if [ -z "$ami" ] || [ "$ami" = None ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No cape-host-base AMI exists yet — EICAR detonation SKIPPED (bootstrap). Layer 5 gates every promotion once the first AMI is baked."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "ami_id=$ami" >> "$GITHUB_OUTPUT"
            echo "::notice::Detonating EICAR against cape-host-base AMI $ami (dev debs overlaid)."
          fi

      - name: Install terraform + jq
        if: ${{ steps.baseline.outputs.skip == 'false' }}
        run: |
          set -euo pipefail
          TF_VERSION="1.13.5"
          curl -fsSL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/terraform
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq

      - name: Run Layer 5 EICAR detonation
        if: ${{ steps.baseline.outputs.skip == 'false' }}
        env:
          THREAT_CONTENT_URL: ${{ vars.THREAT_CONTENT_URL }}
          LAYER5_JOB_ID: ${{ github.run_id }}
          CAPE_ADMIN_SECRET_NAME: ${{ vars.CAPE_ADMIN_SECRET_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${CAPE_ADMIN_SECRET_NAME}" ]; then
            echo "::error::vars.CAPE_ADMIN_SECRET_NAME is unset — Layer 5 needs the CAPE admin Secrets Manager secret name for API auth."
            exit 1
          fi
          ./aws-nested-virt/terraform/test/scripts/run-layer-test.sh \
            --layer 5 \
            --apt-repo-url       "${{ vars.APT_DEV_REPO_URL }}" \
            --apt-keyring-url    "${{ vars.APT_DEV_REPO_URL }}/keyring.asc" \
            --threat-content-url "$THREAT_CONTENT_URL" \
            --cape-core-version       "${{ inputs.cape_core_version }}" \
            --cape-signatures-version "${{ inputs.cape_signatures_version }}" \
            --cape-qemu-version       "${{ inputs.cape_qemu_version }}" \
            --cape-suricata-version   "${{ inputs.cape_suricata_version }}" \
            --cape-host-base-ami-id   "${{ steps.baseline.outputs.ami_id }}" \
            --cape-admin-secret-name  "${CAPE_ADMIN_SECRET_NAME}" \
            --test-run-id     "$GITHUB_RUN_ID" \
            --region          us-east-1

  promote:
    name: Promote dev → prod apt channel
    needs: [layer4, layer5]
    runs-on: ubuntu-latest
    # Same-repo workflow_dispatch via gh CLI — uses GITHUB_TOKEN, no
    # PAT/App needed. Skip when the operator turns off promote_on_success
    # (ad-hoc test runs that shouldn't auto-promote).
    #
    # `needs: [layer4, layer5]` with `success()` would skip promote
    # whenever layer5 itself is skipped (run_layer5=false default), so
    # we use `!failure() && !cancelled()` instead — fires when layer4
    # passed and layer5 didn't fail (passed OR skipped both qualify).
    if: ${{ !failure() && !cancelled() && needs.layer4.result == 'success' && inputs.promote_on_success }}
    steps:
      - name: Trigger apt-publish channel=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run apt-publish.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            -f channel=main
          echo "::notice::Dispatched apt-publish channel=main; cape-* debs published in this e2e run will promote to the prod /noble/ tree."
