###############################################################################
# FakeNet-NG configuration for CAPEv2
#
# Listen-only mode (DivertTraffic: No) — CAPE's rooter.py handles all iptables
# DNAT redirection from analysis VMs to this container. We just need listeners
# on the right ports.
#
# Rooter's inetsim_service_port_trap() redirects well-known ports to the same
# port here. inetsim_trap() catches everything else and sends it to port 1.
###############################################################################

[FakeNet]
DivertTraffic:          No

[Diverter]
NetworkMode:            Auto
DumpPackets:            No
DumpPacketsFilePrefix:  packets
ModifyLocalDNS:         No
StopDNSService:         No
RedirectAllTraffic:     No
LinuxFlushIptables:     No

###############################################################################
# Listeners
###############################################################################

# --- Catch-all on port 1 ------------------------------------------------
# CAPE rooter's inetsim_trap() sends all uncaught TCP SYN/UDP/ICMP to port 1.
[CatchAllTCP]
Enabled:     True
Port:        1
Protocol:    TCP
Listener:    RawListener
UseSSL:      No
Timeout:     10
Hidden:      False

[CatchAllUDP]
Enabled:     True
Port:        1
Protocol:    UDP
Listener:    RawListener
UseSSL:      No
Timeout:     10
Hidden:      False

# --- DNS (UDP 53) --------------------------------------------------------
[DNSListener]
Enabled:     True
Port:        53
Protocol:    UDP
Listener:    DNSListener
ResponseA:   172.28.100.2
ResponseMX:  mail.fakenet.local
ResponseTXT: FAKENET
NXDomains:   0
Hidden:      False

# --- HTTP (TCP 80) -------------------------------------------------------
[HTTPListener80]
Enabled:     True
Port:        80
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      No
Webroot:     defaultFiles/
Timeout:     10
DumpHTTPPosts: No
DumpHTTPPostsFilePrefix: http
Hidden:      False

# --- HTTPS (TCP 443) -----------------------------------------------------
[HTTPListener443]
Enabled:     True
Port:        443
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      Yes
Webroot:     defaultFiles/
Timeout:     10
DumpHTTPPosts: No
DumpHTTPPostsFilePrefix: http
Hidden:      False
static_ca:   Yes
ca_cert:     configs/fakenet_ca.crt
ca_key:      configs/fakenet_ca.key
cert_dir:    configs/temp_certs

# --- HTTP alt (TCP 8080) -------------------------------------------------
[HTTPListener8080]
Enabled:     True
Port:        8080
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      No
Webroot:     defaultFiles/
Timeout:     10
DumpHTTPPosts: No
DumpHTTPPostsFilePrefix: http
Hidden:      False

# --- HTTP alt SSL (TCP 8443) ---------------------------------------------
[HTTPListener8443]
Enabled:     True
Port:        8443
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      Yes
Webroot:     defaultFiles/
Timeout:     10
DumpHTTPPosts: No
DumpHTTPPostsFilePrefix: http
Hidden:      False
static_ca:   Yes
ca_cert:     configs/fakenet_ca.crt
ca_key:      configs/fakenet_ca.key
cert_dir:    configs/temp_certs

# --- SMTP (TCP 25) -------------------------------------------------------
[SMTPListener]
Enabled:     True
Port:        25
Protocol:    TCP
Listener:    SMTPListener
UseSSL:      No
Hidden:      False

# --- SMTPS (TCP 465) -----------------------------------------------------
[SMTPSListener]
Enabled:     True
Port:        465
Protocol:    TCP
Listener:    SMTPListener
UseSSL:      Yes
Hidden:      False

# --- SMTP submission (TCP 587) -------------------------------------------
[SMTPSubmission]
Enabled:     True
Port:        587
Protocol:    TCP
Listener:    SMTPListener
UseSSL:      No
Hidden:      False

# --- FTP (TCP 21) --------------------------------------------------------
[FTPListener21]
Enabled:     True
Port:        21
Protocol:    TCP
Listener:    FTPListener
UseSSL:      No
FTProot:     defaultFiles/
PasvPorts:   60000-60010
Hidden:      False
Banner:      !generic
ServerName:  !gethostname

# --- FTP PASV ports -------------------------------------------------------
[FTPListenerPASV]
Enabled:     True
Port:        60000-60010
Protocol:    TCP
Hidden:      False

# --- FTPS (TCP 990) -------------------------------------------------------
[FTPSListener]
Enabled:     True
Port:        990
Protocol:    TCP
Listener:    FTPListener
UseSSL:      Yes
FTProot:     defaultFiles/
PasvPorts:   60000-60010
Hidden:      False
Banner:      !generic
ServerName:  !gethostname

# --- POP3 (TCP 110) -------------------------------------------------------
[POPListener]
Enabled:     True
Port:        110
Protocol:    TCP
Listener:    POPListener
UseSSL:      No
Hidden:      False

# --- POP3S (TCP 995) ------------------------------------------------------
[POP3SListener]
Enabled:     True
Port:        995
Protocol:    TCP
Listener:    POPListener
