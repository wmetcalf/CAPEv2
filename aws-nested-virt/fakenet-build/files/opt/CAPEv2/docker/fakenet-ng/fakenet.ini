Hidden:      False

# --- TFTP (UDP 69) --------------------------------------------------------
[TFTPListener]
Enabled:     True
Port:        69
Protocol:    UDP
Listener:    TFTPListener
TFTPRoot:    defaultFiles/
Hidden:      False
TFTPFilePrefix: tftp

# --- IRC (TCP 6667) -------------------------------------------------------
[IRCListener]
Enabled:     True
Port:        6667
Protocol:    TCP
Listener:    IRCListener
