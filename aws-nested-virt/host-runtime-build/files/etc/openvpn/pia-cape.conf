# PIA OpenVPN Configuration for CAPE
client
dev tun0
dev-type tun
proto udp
# Set this to your own VPN provider's gateway endpoint (host + port).
remote vpn.example.invalid 1198
resolv-retry infinite
nobind
persist-key
persist-tun
cipher aes-256-cbc
auth sha256
tls-client
remote-cert-tls server

# Authentication
auth-user-pass /etc/openvpn/pia/credentials

# Certificates
ca /etc/openvpn/pia/ca.rsa.2048.crt
crl-verify /etc/openvpn/pia/crl.rsa.2048.pem

# Logging
verb 3
log-append /var/log/openvpn-pia.log

# DNS

# Performance
sndbuf 0
rcvbuf 0
fast-io
reneg-sec 0

# Don't route all traffic through VPN by default
route-nopull
route 10.0.0.0 255.0.0.0 net_gateway
route 172.16.0.0 255.240.0.0 net_gateway
route 192.168.0.0 255.255.0.0 net_gateway

# Re-establish CAPE guest routing on every (re)connect.  Required because
# the tun0 device flaps during PIA renegotiation / network blips, which
# wipes `dev tun0` routes from the policy routing table — the boot-time
# setup-cape-routing.sh run is not enough to keep them in place.  Without
# these hooks, VM analysis traffic silently dies after the first tunnel
# cycle.  See pia-cape-route-up.sh for the full root-cause writeup.
script-security 2
route-up /etc/openvpn/pia-cape-route-up.sh
down /etc/openvpn/pia-cape-down.sh
