# /etc/systemd/system/guac-web.service.d/bind-all.conf
# Shipped by cape-host-runtime.deb.
#
# Override the cape-core-shipped guac-web.service binding so the ASGI
# app listens on 0.0.0.0:8008 instead of 127.0.0.1:8008.  cape-core
# inherits the upstream CAPE default of binding to localhost, which is
# correct for a single-user workstation but blocks every fronting load
# balancer / nginx the sandbox deployment uses.
#
# Why a drop-in instead of editing cape/systemd/guac-web.service:
#   1. cape/ is a subtree of kevoreilly/CAPEv2 — every upstream pull
#      would conflict on the unit file.  Drop-in avoids that.
#   2. Binding is deployment-policy, not application config — putting
#      it in cape-host-runtime (cape-project host-level glue)
#      keeps the cape-core deb a thin bake of upstream behavior.
#
# Why 0.0.0.0 is safe:
#   - The sandbox deployment puts the ALB in front of guac-web, with
#     the ALB security group restricted to admin CIDRs (see
#     terraform/nestedvirt-ami/main.tf aws_security_group.alb).
#   - The host security group only accepts inbound on 8008 from the
#     ALB security group (aws_security_group_rule.alb_to_guac) or
#     from admin CIDRs directly — never from 0.0.0.0/0.
#   - So 0.0.0.0:8008 on the OS side is gated by the SG layer, not
#     left publicly reachable.
#
# Effect: gunicorn's accepted ExecStart override pattern (clear-then-
# set) replaces the cape-core-shipped command with the same arguments
# except for the bind address.  Worker count, timeout, ASGI module,
# capture-output flags are preserved so future cape-core changes to
# the original ExecStart still propagate (operators who want to track
# those changes can remove this drop-in and they take effect).
#
# Caught on a validation deploy 2026-05-22: nestedvirt-ami's userdata.sh had a
# sed that flipped 127→0.0.0.0 at first boot, but it targeted
# /etc/systemd/system/guac-web.service while the cape-core deb ships
# the unit at /usr/lib/systemd/system/guac-web.service.  The sed
# silently never fired and guac sessions failed with ALB Target.Timeout
# until this drop-in landed.
[Service]
ExecStart=
ExecStart=/etc/poetry/bin/poetry run gunicorn --bind 0.0.0.0:8008 web.asgi -t 180 -w 4 -k uvicorn.workers.UvicornWorker --capture-output --enable-stdio-inheritance
