[Service]
# Remove libvirtd's idle-timeout argument so the daemon stays running
# permanently.  Ubuntu's stock libvirtd.service launches with
# `LIBVIRTD_ARGS=--timeout 120`, meaning libvirtd exits when no
# connections are active for 2 min.  CAPE's worker threads connect-
# disconnect frequently (per-VM operations), and on a quiet stretch
# libvirtd can stop just before the next analysis tries to use it —
# the resulting "Cannot connect to libvirt" error doesn't auto-recover
# inside CAPE's machinery layer (it logs the error and the VM stays
# in a broken state).  Mirrored from reference build host.
Environment=LIBVIRTD_ARGS=""
# Restart libvirtd on any unclean exit too.  Pairs with cape.service's
# libvirt-recovery.conf above for full resilience.
Restart=always
RestartSec=5

[Unit]
# Some socket-activated services in libvirtd land suppress the
# `Restart=` directive when stopped via the activating socket.
# RefuseManualStop=no keeps systemd honest — operators can still
# `systemctl stop libvirtd`, but socket-driven stops still trigger
# the configured restart logic.
RefuseManualStop=no
