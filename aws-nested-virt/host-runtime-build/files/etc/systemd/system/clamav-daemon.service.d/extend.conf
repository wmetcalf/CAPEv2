[Service]
# clamav-daemon (clamd) needs /run/clamav to exist + be owned by the
# clamav user before it can bind its UNIX socket.  Ubuntu's
# clamav-daemon.service relies on a tmpfiles.d entry to provision the
# directory, but that fires after `systemd-tmpfiles --create` which
# runs early in boot — under heavy parallel boot it can race the
# daemon's first start and clamd exits with "ERROR: LOCAL: Could not
# bind to socket /run/clamav/clamd.ctl: Permission denied".  Cape's
# processing pipeline then sees clamd unavailable and skips ClamAV
# scoring on every task until a manual restart.
#
# Forcing the mkdir + chown in ExecStartPre eliminates the race
# regardless of tmpfiles timing.  Mirrored from reference live host
#.
ExecStartPre=-/bin/mkdir -p /run/clamav
ExecStartPre=/bin/chown clamav /run/clamav
