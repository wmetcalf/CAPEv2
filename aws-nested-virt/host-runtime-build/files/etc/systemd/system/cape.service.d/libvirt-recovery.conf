[Unit]
# Soft dependency: cape.service wants libvirtd but should outlive a libvirtd
# blip rather than die with it.  network-deps.conf (in this same drop-in
# directory) handles ordering + the libvirt network start; this drop-in
# handles failure recovery.
Wants=libvirtd.service
After=libvirtd.service

[Service]
# Restart cape.service on any unclean exit — the unit's main process
# (cuckoo.py) can die on transient libvirt errors, postgres restarts,
# or temporary network blips.  Without this it stays dead until
# operator intervention.  Mirrored from the reference live host
# where this drop-in has kept the analyzer up across multiple
# libvirtd restarts without manual action.
Restart=always
RestartSec=10
# Give CAPE up to 5 min to drain in-flight analyses on graceful stop.
# The scheduler responds to SIGTERM by finishing the current batch
# (it logs "received signal 'SIGTERM', waiting for remaining analysis
# to finish before stopping").  Default TimeoutStopSec=90s isn't
# enough for VMs mid-analysis to commit results.
TimeoutStopSec=300
