# /etc/systemd/system/cape.service.d/network-deps.conf
# Shipped by cape-host-runtime.deb.
#
# Gate cape.service startup on the two network preconditions that
# cape's startup code assumes are already in place:
#
#   - libvirtd running with the cape-100 / virbr100 libvirt network
#     active.  cape's machinery checker (lib/cuckoo/core/startup.py)
#     reaches into libvirt to verify each kvm.conf-listed VM has a
#     snapshot.  If libvirtd isn't up yet, cuckoo.py crashes on
#     init with `libvirt: failed to connect to qemu:///system`.
#
#   - tun0 interface present.  cape's routing init (init_routing in
#     startup.py) validates the [vpn0] rt_table=tun0 entry from
#     routing.conf; without the tun0 device libvirt+iproute2 raise
#     and cuckoo crashes at boot with `CuckooStartupError: The
#     routing table that has been configured for VPN vpn0 is not
#     available`.
#
# The retries here exist because of startup-order races on a freshly-
# rebooted host: libvirtd's own postinst sometimes hasn't created
# the cape-100 net by the time cape.service tries to start, and
# openvpn-pia.service can take 10-20s to bring tun0 up.
#
# Moved from terraform/nestedvirt-ami/userdata.sh on 2026-05-26 per
# the same architectural cleanup that moved web.conf flips into
# cape-host-config postinst — heredoc'd systemd drop-ins
# in userdata are operationally invisible (no diff review, no deb
# Version bump on change) and should live in their owning deb.
#
# Once a fresh AMI bakes with this file present, the matching
# `mkdir -p /etc/systemd/system/cape.service.d && cat > ...` block
# in userdata.sh becomes a no-op idempotent restate of the same
# content and can be removed in a follow-up IaC commit.

[Unit]
Wants=libvirtd.service
Wants=openvpn-pia.service
After=libvirtd.service openvpn-pia.service

[Service]
ExecStartPre=+/bin/bash -c 'for i in 1 2 3 4 5; do virsh net-start cape-100 2>/dev/null && break || sleep 2; done; virsh net-info cape-100 | grep -q "Active:.*yes"'
ExecStartPre=+/bin/bash -c 'for i in $(seq 1 30); do ip link show tun0 >/dev/null 2>&1 && exit 0; sleep 2; done; echo "tun0 did not appear before CAPE startup" >&2; exit 1'
