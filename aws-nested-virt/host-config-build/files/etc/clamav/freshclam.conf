# /etc/clamav/freshclam.conf — managed
#
# DatabaseMirror is the Cisco-Talos public network; we DO NOT mirror
# main.cvd/daily.cvd/bytecode.cvd through the local mirror — Cisco's own mirror
# is the right distribution path.
#
# DatabaseCustomURL entries point at the threat-content release's
# mirror of 3rd-party signature feeds (SaneSecurity, URLhaus, twinclams,
# wmetcalf clam-punch).  Build pipeline: sandbox-code clamav-mirror-build
# fetches upstream → apt-publish uploads them as bare-named assets to
# the threat-content GitHub Release, served at https://apt.example.invalid/

# Daemon defaults shipped by the clamav-base package — keep them.
DatabaseDirectory /var/lib/clamav
UpdateLogFile /var/log/clamav/freshclam.log
LogVerbose false
LogSyslog false
LogFacility LOG_LOCAL6
LogFileMaxSize 0
LogRotate true
LogTime true
Foreground false
Debug false
MaxAttempts 5
DatabaseOwner clamav
AllowSupplementaryGroups false
PidFile /run/clamav/freshclam.pid
ConnectTimeout 30
ReceiveTimeout 0
TestDatabases yes
ScriptedUpdates yes
CompressLocalDatabase no
SafeBrowsing false
Bytecode true
NotifyClamd /etc/clamav/clamd.conf
# Check 24x per day, evenly spaced.
Checks 24

# ---------------------------------------------------------------------------
# Standard ClamAV signature DBs — keep on Cisco's mirror network.
# ---------------------------------------------------------------------------
DatabaseMirror database.clamav.net

# ---------------------------------------------------------------------------
# Mirrored 3rd-party signature feeds.
# ---------------------------------------------------------------------------
# SaneSecurity (GPL signatures)
DatabaseCustomURL https://apt.example.invalid/junk.ndb
DatabaseCustomURL https://apt.example.invalid/jurlbl.ndb
DatabaseCustomURL https://apt.example.invalid/phish.ndb
DatabaseCustomURL https://apt.example.invalid/rogue.hdb
DatabaseCustomURL https://apt.example.invalid/sanesecurity.ftm
DatabaseCustomURL https://apt.example.invalid/scam.ndb
DatabaseCustomURL https://apt.example.invalid/sigwhitelist.ign2
DatabaseCustomURL https://apt.example.invalid/spamattach.hdb
DatabaseCustomURL https://apt.example.invalid/spamimg.hdb
DatabaseCustomURL https://apt.example.invalid/winnow.attachments.hdb
DatabaseCustomURL https://apt.example.invalid/winnow_bad_cw.hdb
DatabaseCustomURL https://apt.example.invalid/winnow_extended_malware.hdb
DatabaseCustomURL https://apt.example.invalid/winnow_malware.hdb
DatabaseCustomURL https://apt.example.invalid/winnow_malware_links.ndb
# URLhaus (abuse.ch)
DatabaseCustomURL https://apt.example.invalid/urlhaus.ndb
# Splunk twinclams
DatabaseCustomURL https://apt.example.invalid/twinclams.ldb
DatabaseCustomURL https://apt.example.invalid/twinwave.ign2
# wmetcalf clam-punch (FP suppressions + extras)
DatabaseCustomURL https://apt.example.invalid/miscreantpunch099.ldb

# SecuriteInfo (paid subscription, token-gated) — NOT mirrored through
# the local mirror (re-distribution of token-gated content has license issues).
# Tenants with their own SecuriteInfo subscription should append their
# own DatabaseCustomURL entries with their token:
#
#   DatabaseCustomURL https://www.securiteinfo.com/get/signatures/<TOKEN>/securiteinfo.hdb
#   ... (other securiteinfo databases) ...
