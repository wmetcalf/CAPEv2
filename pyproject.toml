[project]
name = "CAPEv2"
version = "0.1.0"
description = "CAPE: Malware Configuration And Payload Extraction"
authors = [
    { name = "Kevin O'Reilly", email = "kev@capesandbox.com" },
    { name = "doomedraven", email = "doomedraven@capesandbox.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10, <4.0"
dependencies = [
    "alembic==1.9.4",
    "gevent==24.2.1",
    "greenlet==3.0.3",
    "Pebble==5.1.0",
    # "pymisp==2.4.144",
    "cryptography>=44.0.1",
    "requests[security,socks]==2.32.4",
    # "pyOpenSSL==24.0.0",
    "pefile",
    "tldextract>=5.1.2",
    "oletools==0.60.2",
    "olefile==0.47",
    # "mixbox==1.0.5",
    "capstone==5.0.5",
    "pycryptodomex>=3.20.0",
    # "xmltodict==0.12.0",
    "requests-file>=1.5.1",
    "orjson>=3.9.15",
    # "maec==4.1.0.17",
    # "regex==2021.7.6",
    "SFlock2[linux,shellcode]>=0.3.76",
    # "volatility3==2.11.0",
    # "XLMMacroDeobfuscator==0.2.7",
    "pyzipper==0.3.6",
    "flare-capa==9.3.1",
    "Cython==3.0.11",
    "Django>=4.2.18",
    "SQLAlchemy==2.0.41",
    "SQLAlchemy-Utils==0.41.1",
    "Jinja2>=3.1.6",
    "chardet==4.0.0",
    "pygal==2.4.0",
    "dpkt==1.9.6",
    "dnspython==2.7.0",
    "pytz==2021.1",
    "maxminddb==2.6.3",
    "Pillow>=8.2.0",
    "python-whois==0.9.5",
    "bs4==0.0.1",
    "pydeep2==0.5.1",
    "django-recaptcha==4.0.0",  # https://pypi.org/project/django-recaptcha/
    "django-crispy-forms==2.3",
    "crispy-bootstrap4==2024.10",
    "django-settings-export==1.2.1",
    "django-csp==3.8",
    "django-extensions==3.2.3",
    "django-ratelimit==4.1.0",
    # "qrcode==7.2",
    "python-tlsh==4.5.0",
    "djangorestframework==3.15.2",
    "yara-python==4.5.1",
    "pymongo>=4.0.1",
    # "ImageHash==4.3.1",
    "LnkParse3==1.5.0",
    "cachetools>=5.5.1",
    "django-allauth==65.13.0",  # https://django-allauth.readthedocs.io/en/latest/configuration.html
    # "socks5man @ git+https://github.com/CAPESandbox/socks5man.git@7b335d027297b67abdf28f38cc7d5d42c9d810b5",
    # "httpreplay @ git+https://github.com/CAPESandbox/httpreplay.git@0d5a5b3144ab15f93189b83ca8188afde43db134",
    # "bingraph @ git+https://github.com/CAPESandbox/binGraph.git@552d1210ac6770f8b202d0d1fc4610cc14d878ec",
    "psycopg2-binary>=2.9.10",
    "ruff>=0.7.2",
    "paramiko==3.5.0",
    "psutil==6.1.1",
    "peepdf-3==5.0.0",
    "pyre2>=0.3.10",
    "Werkzeug==3.1.5",
    "packaging==24.2",
    "setuptools==78.1.1",
    # command line config manipulation
    "crudini==0.9.5",
    "python-dateutil==2.9.0.post0",
    "python-msi>=0.0.0a3",
    # guac-session
    "pyguacamole>=0.11",
    "uvicorn[standard]>=0.18.2",
    "gunicorn>=23.0.0",
    "channels[daphne]>=4.0.0",
    "setproctitle==1.3.2",
    "CAPE-parsers>=0.1.36",
    "maco==1.1.8",
    # --- cape-project additions (preserved across upstream subtree merges) ---
    # libvirt Python bindings — lib/cuckoo/core/startup.py imports libvirt
    # during init_modules()/check_snapshot_state() for KVM/QEMU machinery
    # probing.  Without this in the venv, both cape-processor and
    # cape.service (cuckoo.py) crash at startup with
    # CuckooStartupError("'libvirt-python' library is required for
    # KVM/QEMU machinery but could not be imported").  Built against
    # libvirt-dev (already in debian/control Build-Depends).
    "libvirt-python>=11.0.0",
    # ClamAV integration — lib/cuckoo/common/integrations/clamav.py imports
    # pyclamd when processing.detections.clamav is enabled.  Without this
    # HAVE_CLAMAV falls back to False and every clamav scan silently
    # returns no matches.
    "pyclamd",
    # Static-string extraction module (modules/processing/strings/floss.py
    # consumes flare-floss).  Replaces install-nestedvirt.sh's
    # `poetry run pip install -U flare-floss` post-install step.
    "flare-floss",
    # Python 3.12 removed the stdlib asyncore/asynchat modules; the CAPE
    # smtp sinkhole module + legacy plumbing still import them.
    # pyasyncore backports them as drop-in pip packages.
    "pyasyncore",
    # Threat-intel attack-pattern lookup used by signatures and reporting.
    "pyattck",
    # Windows EVTX (event log) parser — web/analysis/views.py imports
    # `from evtx import PyEvtxParser` to render the per-task Event Log
    # tab.  Without this in the venv the analyzer collects EVTX archives
    # from the guest (analyzer/windows/modules/auxiliary/evtx.py) and
    # writes them to evtx/evtx.zip, but the web UI fails to load any
    # of them with "EVTX parser not installed on the web node".
    # omerbenamram/pyevtx-rs — Rust-backed, ships PyO3 bindings.
    "evtx",
    # Sigma detection over guest EVTX/Sysmon logs via Zircolite
    # (community/modules/processing/sigma.py).  sigma.py shells out to
    # /opt/zircolite/zircolite.py using sys.executable (THIS venv), so
    # Zircolite's runtime deps must live here.  The authoritative dep set
    # is Zircolite v3.2.0's requirements.txt — the version pinned by
    # cape-zircolite-build/fetch.sh and proven on the reference host
    # to run inside this exact shared venv producing real sigma
    # detections.  We do NOT track Zircolite "latest": v3.7.x tightened
    # `chardet` -> `>=5.0,<6`, which is unsatisfiable against cape's
    # chardet==4.0.0 pin (load-bearing in our own report encoding
    # detection).  v3.2.0 leaves chardet unpinned, so cape's 4.0.0
    # satisfies it.
    #
    # Of v3.2.0's requirements, orjson/chardet/requests/jinja2/psutil and
    # evtx are already declared above and rich/urllib3/pyyaml come in
    # transitively (the reference build host runs rich 13.9.4 fine despite the aspirational
    # >=14.2.0 — don't force it and risk a transitive clash).  The rest:
    "xxhash",
    "lxml",
    "pysigma",
    "pysigma-pipeline-sysmon",
    "pysigma-pipeline-windows",
    "pysigma-backend-sqlite",
    # The one dep that bit us: Zircolite's detector compiles Sigma field-
    # mapping expressions through RestrictedPython.  Missing it aborted
    # every analysis with `ModuleNotFoundError: No module named
    # 'RestrictedPython'` (caught on the 2026-06-03 sigma AMI deploy).
    "RestrictedPython",
]

[project.optional-dependencies]
maco = ["maco"]
gcp = ["google-cloud-storage", "google-cloud-pubsub"]
yara = ["plyara"]
mcp = ["fastmcp", "httpx"]

[dependency-groups]
dev = [
    "black>=24.3.0",
    "isort>=5.10.1",
    "mypy==1.14.1",
    "pytest==7.2.2",
    "pytest-pretty==1.1.0",
    "pytest-cov==3.0.0",
    "pytest-mock==3.7.0",
    "pytest-django==4.5.2",
    "pytest-asyncio==0.18.3",
    "pytest-xdist==3.6.1",
    "pytest-freezer==0.4.8",
    "tenacity==8.1.0",
    "types-requests>=2.32",
    "httpretty>=1.1.4",
    "func-timeout>=4.3.5",
    "pre-commit>=2.19.0",
]

[tool.poetry]
package-mode = false

[tool.uv]
package = false

[tool.black]
line-length = 132
include = "\\.py(_disabled)?$"

[tool.isort]
profile = "black"
no_lines_before = ["FUTURE", "STDLIB"]
line_length = 132
supported_extensions = ["py", "py_disabled"]

[tool.flake8]
max-line-length = 132
exclude = ".git,__pycache__,.cache,.venv"

[tool.pytest.ini_options]
django_find_project = false
DJANGO_SETTINGS_MODULE = "web.settings"
pythonpath = [".", "web"]
testpaths = ["tests", "agent"]
norecursedirs = "tests/zip_compound"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 132
exclude = [
    "./analyzer/linux/dbus_next",
]

[tool.ruff.lint]
select = [
	"F",       # pyflakes
	"E",       # pycodestyle errors
	"W",       # pycodestyle warnings
	# "I",       # isort
	# "N",       # pep8-naming
	"G",       # flake8-logging-format
]

ignore = [
    "E501",    # ignore due to conflict with formatter
    "N818",    # exceptions don't need the Error suffix
    "E741",    # allow ambiguous variable names
    "E402",
    "W605",    # ToDo to fix - Invalid escape sequence
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"stubs/*" = [
    "N",       # naming conventions don't matter in stubs
    "F403",    # star imports are okay in stubs
    "F405",    # star imports are okay in stubs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["libqtile", "test"]
default-section = "third-party"

[tool.mypy]
warn_unused_configs = true
files = [
    "agent/**/*.py",
]
